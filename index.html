<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./assets/css/styles.css">

    <!-- Config first, then main JS -->
    <script src="./assets/js/config.js"></script>
    <script defer src="./assets/js/app.js"></script>
</head>
<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader"></div>
    </div>

    <!-- Header / Navigation -->
    <header>
        <nav>
            <ul>
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#messages">Messages</a></li>
                <li><a href="#games">Games</a></li>
                <li><a href="#gallery">Gallery</a></li>
            </ul>
        </nav>
    </header>

    <!-- Home Section -->
    <section id="home" style="background-image: url('assets/images/birthday-doodle.jpg'); background-size: cover; background-position: center;">
        <div class="home-content">
            <h1>🎉 Happy Birthday! 🎉</h1>
            <p>Welcome to your special birthday website!</p>
            <button id="start-btn">Enter</button>
        </div>

        <!-- Background Canvas for stars -->
        <canvas id="backgroundCanvas"></canvas>
    </section>

    <!-- Messages Section -->
    <section id="messages">
        <h2>Messages for You</h2>
        <div class="message-container">
            <!-- Messages will be dynamically generated via app.js -->
        </div>
    </section>

    <!-- Games Section -->
    <section id="games">
        <h2>Mini Games</h2>
        <div class="games-container">
            <button class="game-btn" onclick="startGame('catchHearts')">Catch the Hearts</button>
            <button class="game-btn" onclick="startGame('birthdayQuiz')">Birthday Quiz</button>
        </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery">
        <h2>Birthday Memories</h2>
        <div class="gallery-container">
            <img src="assets/images/photo1.jpg" alt="Memory 1">
            <img src="assets/images/photo2.jpg" alt="Memory 2">
            <img src="assets/images/photo3.jpg" alt="Memory 3">
        </div>
    </section>

    <!-- Footer Section -->
    <footer>
        <p>Made with ❤️ for a special birthday</p>
        <audio id="bg-music" controls loop>
            <source src="assets/music/happy_birthday.mp3" type="audio/mpeg">
        </audio>
    </footer>

    <!-- Floating Hearts container (created dynamically via JS) -->
    <div id="hearts-container"></div>
</body>
</html>
